version: v2
inputs:
  - directory: proto
plugins:
  # Go
  - local: protoc-gen-go
    out: daemon/gen
    opt:
      - paths=source_relative
  - local: protoc-gen-connect-go
    out: daemon/gen
    opt:
      - paths=source_relative
  # TypeScript
  - local: node_modules/.bin/protoc-gen-es
    out: tui/src/gen
    opt:
      - target=ts
      - import_extension=js
  - local: node_modules/.bin/protoc-gen-connect-es
    out: tui/src/gen
    opt:
      - target=ts
      - import_extension=js
